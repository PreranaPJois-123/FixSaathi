services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fixsaathi
      POSTGRES_PASSWORD: fixsaathi
      POSTGRES_DB: fixsaathi
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixsaathi"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fixsaathi:fixsaathi@db:5432/fixsaathi
      CORS_ORIGINS: http://localhost:5173
      PORT: "8000"
      FIXSAATHI_DATA_DIR: /data
    # migrations, then idempotent load of the processed repair records (skips if the file is missing), then the API
    command: sh -c "alembic upgrade head && python scripts/ingest_knowledge.py --if-present && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - uploads:/app/uploads
      - ./data:/data
    restart: unless-stopped
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      retries: 6

  frontend:
    build:
      context: ./frontend
      args: { VITE_API_BASE_URL: http://localhost:8000 }
    ports: ["5173:80"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
  uploads:
